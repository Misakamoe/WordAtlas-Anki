name: Release

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: word-atlas-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      builder_sha: ${{ steps.check.outputs.builder_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install verified builder
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Check successful baseline and pinned upstream inputs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m word_atlas_anki release-check --repo "$GITHUB_REPOSITORY" --state .cache/release-state.json
      - name: Install validation tools
        if: steps.check.outputs.needs_update == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m playwright install --with-deps --only-shell chromium
      - name: Validate before building release
        if: steps.check.outputs.needs_update == 'true'
        run: |
          node --check templates/card.js
          python -m pytest --junitxml=test-results/pytest.xml
      - name: Build full offline deck from the checked snapshot
        if: steps.check.outputs.needs_update == 'true'
        run: |
          python -m word_atlas_anki release-build --state .cache/release-state.json --out dist
          python -m word_atlas_anki verify --out dist --release --native --report test-results/full-native.json
      - name: Test real full-deck layouts
        if: steps.check.outputs.needs_update == 'true'
        env:
          WA_REAL_DIST: dist
        run: python -m pytest tests/test_templates.py -k real_deck --junitxml=test-results/real-layouts.xml
      - name: Transfer complete candidate
        if: steps.check.outputs.needs_update == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Transfer preflight state
        if: steps.check.outputs.needs_update == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-state
          path: .cache/release-state.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Keep failed-build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-diagnostics
          path: |
            test-results/
            .cache/release-state.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: build
    if: needs.build.outputs.needs_update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.builder_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install verified publisher
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-state
          path: .cache/
      - name: Verify, upload to draft, then publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m word_atlas_anki publish --repo "$GITHUB_REPOSITORY" --out dist --state .cache/release-state.json
