name: CI and Release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      cleanup_dry_run:
        description: 'Preview cleanup without deleting runs; release still runs normally'
        type: boolean
        default: true
  schedule:
    - cron: '23 3 */3 * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'word-atlas-release' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  test:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 120 || 30 }}
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      builder_sha: ${{ steps.check.outputs.builder_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine validation scope
        id: scope
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          event_name = os.environ["GITHUB_EVENT_NAME"]
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          required = event_name != "schedule"
          if event_name in ("push", "pull_request"):
              base = event.get("before") if event_name == "push" else event.get("pull_request", {}).get("base", {}).get("sha")
              head = os.environ["GITHUB_SHA"]
              if all(isinstance(sha, str) and re.fullmatch(r"[0-9a-f]{40}", sha) and sha != "0" * 40 for sha in (base, head)):
                  try:
                      changed = subprocess.check_output(
                          ["git", "diff", "--no-ext-diff", "--no-renames", "--name-only", "-z", base, head, "--"],
                          stderr=subprocess.DEVNULL,
                      )
                  except (subprocess.CalledProcessError, OSError):
                      pass  # An unavailable comparison must not skip validation.
                  else:
                      paths = [path for path in changed.split(b"\0") if path]
                      required = any(path != b"README.md" and not path.startswith(b"docs/") for path in paths)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"test_required={str(required).lower()}\n")
          print(f"Run code validation: {required}")
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.scope.outputs.test_required == 'true' || (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install verified builder
        if: steps.scope.outputs.test_required == 'true' || (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Check successful baseline and pinned upstream inputs
        id: check
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m word_atlas_anki release-check --repo "$GITHUB_REPOSITORY" --state .cache/release-state.json
      - name: Install validation tools
        if: steps.scope.outputs.test_required == 'true' || steps.check.outputs.needs_update == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m playwright install --with-deps --only-shell chromium
      - name: Test offline conversion, native imports and layouts
        id: tests
        if: steps.scope.outputs.test_required == 'true' || steps.check.outputs.needs_update == 'true'
        run: |
          node --check templates/card.js
          python -m pytest --junitxml=test-results/pytest.xml
      - name: Build full offline deck from the checked snapshot
        if: steps.check.outputs.needs_update == 'true'
        run: |
          python -m word_atlas_anki release-build --state .cache/release-state.json --out dist
          python -m word_atlas_anki verify --out dist --release --native --report test-results/full-native.json
      - name: Test real full-deck layouts
        if: steps.check.outputs.needs_update == 'true'
        env:
          WA_REAL_DIST: dist
        run: python -m pytest tests/test_templates.py -k real_deck --junitxml=test-results/real-layouts.xml
      - name: Transfer complete candidate
        if: steps.check.outputs.needs_update == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Transfer preflight state
        if: steps.check.outputs.needs_update == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-state
          path: .cache/release-state.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Keep test and build diagnostics
        if: always() && (steps.tests.outcome != 'skipped' || failure())
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            test-results/
            .cache/release-state.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.test.outputs.needs_update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.test.outputs.builder_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install verified publisher
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-state
          path: .cache/
      - name: Verify, upload to draft, then publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m word_atlas_anki publish --repo "$GITHUB_REPOSITORY" --out dist --state .cache/release-state.json

  cleanup:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete completed workflow runs older than seven days
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CLEANUP_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_dry_run }}
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const dryRun = process.env.CLEANUP_DRY_RUN === 'true';
            const counts = {scanned: 0, candidates: 0, deleted: 0, would_delete: 0, skipped: 0, failed: 0};
            const eligible = run => String(run.id) !== String(context.runId)
              && run.status === 'completed'
              && Date.parse(run.created_at) < cutoff
              && Date.parse(run.updated_at) < cutoff;
            try {
              // Unfiltered pagination avoids the search cap; finish listing before any deletion.
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...context.repo, per_page: 100
              });
              counts.scanned = runs.length;
              const candidates = new Set(runs.filter(eligible).map(run => String(run.id)));
              counts.candidates = candidates.size;
              counts.skipped = runs.length - candidates.size;
              for (const runId of candidates) {
                core.info(`Checking workflow run ${runId}`);
                const {data: run} = await github.rest.actions.getWorkflowRun({
                  ...context.repo, run_id: runId
                });
                // An old run may have been rerun since it was listed.
                if (!eligible(run)) {
                  counts.skipped++;
                  continue;
                }
                if (dryRun) {
                  core.info(`Would delete workflow run ${runId}`);
                  counts.would_delete++;
                } else {
                  await github.rest.actions.deleteWorkflowRun({...context.repo, run_id: runId});
                  counts.deleted++;
                }
              }
            } catch (error) {
              counts.failed++;
              core.setFailed(error.message);
            } finally {
              core.info(JSON.stringify(counts));
              await core.summary
                .addHeading('Workflow run cleanup')
                .addRaw(`Cutoff: ${new Date(cutoff).toISOString()}; dry-run: ${dryRun}\n\n`)
                .addTable([
                  [{data: 'Counter', header: true}, {data: 'Count', header: true}],
                  ...Object.entries(counts).map(([name, value]) => [name, String(value)])
                ])
                .write();
            }
